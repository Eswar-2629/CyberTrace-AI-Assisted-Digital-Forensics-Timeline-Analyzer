services:
  postgres:
    image: postgres:16
    container_name: cybertrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cybertrace
      POSTGRES_USER: cybertrace
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - cybertrace_pgdata:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybertrace -d cybertrace"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  cybertrace_pgdata:
  